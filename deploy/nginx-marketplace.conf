# ==========================================================================
#  Nginx como proxy reverso + HTTPS para o Marketplace.
#  Copie para /etc/nginx/sites-available/marketplace e ative:
#    sudo ln -s /etc/nginx/sites-available/marketplace /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#  Ajuste "server_name" para o IP/host da VM.
# ==========================================================================

# Redireciona HTTP -> HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;   # troque pelo IP/host da VM, ex.: 10.0.0.15

    ssl_certificate     /etc/ssl/marketplace/server.crt;
    ssl_certificate_key /etc/ssl/marketplace/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Cabeçalhos de segurança reforçados na borda
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
